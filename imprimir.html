<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa para imprimir — MINULP 2026</title>
<link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fuente.css">
<link rel="stylesheet" href="css/marcas.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="img/icons/icon-192.png">
<style>
/* ===========================================================================
   Mapa imprimible. La hoja se dibuja en milimetros reales: en pantalla se
   escala para que entre en el preview, y al imprimir sale a tamano natural.
   =========================================================================== */
body { display: block; background: var(--papel-3); }

.pi-cab {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--navy); color: #fff;
}
.pi-cab h1 { font-size: 1rem; margin: 0; flex: 1 1 auto; }
.pi-cab .btn-pri { flex: 0 0 auto; background: #fff; color: var(--navy); }
.pi-cab a { color: #c9cdf0; font-size: .85rem; text-decoration: none; font-weight: 600; }

.pi-cuerpo { display: flex; gap: 18px; align-items: flex-start; padding: 16px; }

.pi-panel {
  flex: 0 0 268px; position: sticky; top: 64px;
  background: var(--papel); border: 1px solid var(--borde);
  border-radius: var(--r); padding: 14px;
}
.pi-panel h2 {
  font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--tinta-2); margin: 14px 0 7px;
}
.pi-panel h2:first-child { margin-top: 0; }
.pi-op {
  display: flex; align-items: center; gap: 9px;
  min-height: 34px; cursor: pointer; font-size: .88rem;
}
.pi-op input { width: 18px; height: 18px; accent-color: var(--navy); flex: 0 0 auto; }
.pi-op img { width: 20px; height: 20px; border-radius: 50%; }
.pi-punto {
  border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center;
}
.pi-punto svg { fill: #fff; display: block; }
.pi-op .pi-punto { width: 16px; height: 16px; }
.pi-op .pi-punto svg { width: 10px; height: 10px; }
.pi-sub { padding-left: 4px; border-left: 2px solid var(--borde); margin-left: 8px; }
.pi-mini { font-size: .78rem; color: var(--tinta-2); margin: 4px 0 0; }
.pi-fila-btn { display: flex; gap: 6px; margin-top: 6px; }
.pi-fila-btn button {
  flex: 1 1 auto; min-height: 32px; font-size: .78rem; font-weight: 600;
  border: 1px solid var(--borde); border-radius: 8px;
  background: var(--papel-2); color: var(--tinta); cursor: pointer;
}

.pi-lienzo { flex: 1 1 auto; min-width: 0; display: grid; place-items: start center; }
.pi-escala { transform-origin: top center; }

/* ------------------------------------------------------------------- hoja */
.hoja {
  width: 297mm; height: 210mm;
  background: #fff; color: #14161f;
  position: relative;              /* referencia para medir sin el transform */
  display: flex; overflow: hidden;
  box-shadow: 0 6px 30px rgba(0, 0, 0, .22);
  font-family: var(--tipo);
}
.hoja[data-orient="vertical"] { width: 210mm; height: 297mm; flex-direction: column; }

.hoja-izq {
  flex: 0 0 auto; display: flex; flex-direction: column;
  padding: 7mm 0 5mm 7mm;
}
.hoja-mapa { position: relative; flex: 0 0 auto; }
.hoja[data-orient="apaisado"] .hoja-mapa { width: 186mm; height: 186mm; }
.hoja[data-orient="vertical"] .hoja-izq { padding: 6mm 7mm 3mm; }
.hoja[data-orient="vertical"] .hoja-mapa { width: 170mm; height: 170mm; margin: 0 auto; }
.hoja-mapa img { width: 100%; height: 100%; display: block; border-radius: 2mm; }

.hoja-lado {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column;
  padding: 7mm 7mm 6mm 6mm;
}
.hoja[data-orient="vertical"] .hoja-lado { padding: 0 7mm 6mm; flex: 1 1 auto; }

.hoja-titulo { display: flex; align-items: center; gap: 4mm; margin-bottom: 3.5mm; }
.hoja-titulo img { width: 22mm; height: 22mm; flex: 0 0 auto; }
.hoja-titulo b { display: block; font-size: 6.4mm; line-height: 1.05; color: #0e153e; white-space: nowrap; }
.hoja-titulo span { font-size: 2.8mm; color: #4b5060; line-height: 1.35; display: block; }

.refs-tit {
  background: #0e153e; color: #fff; border-radius: 2mm;
  padding: 1.6mm 3mm; font-size: 3.6mm; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3mm;
  display: inline-block;
}
.refs { column-gap: 6mm; font-size: 2.9mm; }
.refs[data-cols="1"] { columns: 1; }
.refs[data-cols="2"] { columns: 2; }
.refs[data-cols="3"] { columns: 3; }

.refs-grupo { margin-bottom: 3mm; }
.refs-grupo > p { break-after: avoid; }   /* el titulo no queda solo al pie de una columna */
.refs-grupo > p {
  margin: 0 0 1.2mm; font-size: 2.6mm; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: #6b7080; break-after: avoid;
}
.ref {
  display: flex; align-items: flex-start; gap: 2mm;
  margin-bottom: 1.4mm; break-inside: avoid; line-height: 1.25;
}
.ref > span { padding-top: .8mm; }
.ref img { width: 6mm; height: 6mm; border-radius: 50%; flex: 0 0 auto; }
.ref .pi-punto { width: 6mm; height: 6mm; }
.ref .pi-punto svg { width: 3.6mm; height: 3.6mm; }
.ref b { font-weight: 700; }
.ref span { color: #4b5060; }

.hoja-pie {
  margin-top: 3mm; padding-top: 2.5mm; border-top: .3mm solid #d5d8e2;
  font-size: 2.5mm; color: #6b7080; line-height: 1.5;
}
.hoja-pie b { color: #14161f; font-weight: 700; }

/* ------------------------------------------------------- marcas en la hoja */
.hoja-qr {
  position: absolute; right: 2mm; bottom: 2mm;
  width: 46mm; padding: 2.5mm 2.5mm 2mm;
  background: rgba(255, 255, 255, .93);
  border-radius: 2mm; box-shadow: 0 .3mm 1mm rgba(0, 0, 0, .25);
  text-align: center;
}
.hoja-qr[hidden] { display: none; }
.hoja-qr svg { width: 100%; height: auto; display: block; }
.hoja-qr b {
  display: block; margin-top: 1.2mm; font-size: 2.9mm; line-height: 1.25;
  color: #0e153e; word-break: break-all;
}
.hoja-qr i { display: block; margin-top: 1.4mm; font-size: 2.7mm; font-style: normal; color: #4b5060; }

.hm { position: absolute; transform: translate(-50%, -50%); text-align: center; }
.hm-disco {
  width: 7mm; height: 7mm; border-radius: 50%;
  border: .5mm solid #fff; box-shadow: 0 .3mm .8mm rgba(0, 0, 0, .4);
  display: grid; place-items: center; margin: 0 auto;
}
.hm-disco img { width: 100%; height: 100%; border-radius: 50%; display: block; }
.hm-disco svg { width: 4mm; height: 4mm; fill: #fff; }
.hm-serv .hm-disco { width: 5mm; height: 5mm; border-width: .4mm; }
.hm-serv .hm-disco svg { width: 3mm; height: 3mm; }
.hm-rot {
  position: absolute; left: 50%; transform: translateX(-50%);
  margin-top: .4mm; padding: .2mm 1mm; border-radius: .8mm;
  background: rgba(255, 255, 255, .92);
  font-size: 2.5mm; font-weight: 700; white-space: nowrap;
  box-shadow: 0 .2mm .5mm rgba(0, 0, 0, .25);
}

/* ------------------------------------------------------------- impresion */
@media print {
  @page { margin: 0; }                 /* el tamaño lo pone la regla que inyecta el script */
  html, body { background: #fff; height: auto; }
  .pi-cab, .pi-panel { display: none !important; }
  .pi-cuerpo { display: block; padding: 0; }
  .pi-lienzo { display: block; }
  /* la escala es solo para el preview: en papel la hoja va a tamaño natural */
  .pi-escala { transform: none !important; height: auto !important; }
  .hoja { box-shadow: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header class="pi-cab">
  <h1>Mapa para imprimir</h1>
  <a href="index.html">← Volver a la app</a>
  <button type="button" class="btn-pri" id="btn-imprimir">Imprimir o guardar PDF</button>
</header>

<div class="pi-cuerpo">
  <aside class="pi-panel">
    <h2>Hoja</h2>
    <label class="pi-op"><input type="radio" name="orient" value="apaisado" checked> A4 apaisado</label>
    <label class="pi-op"><input type="radio" name="orient" value="vertical"> A4 vertical</label>
    <label class="pi-op"><input type="checkbox" id="op-oficial"> Usar el mapa con los nombres</label>
    <label class="pi-op"><input type="checkbox" id="op-rotulos" checked> Mostrar las siglas sobre el mapa</label>
    <label class="pi-op" style="gap:7px">Referencias en
      <select id="op-cols" aria-label="Columnas de las referencias"
              style="min-height:32px;padding:4px 8px;border:1px solid var(--borde);border-radius:8px;background:var(--papel-2);color:var(--tinta)">
        <option value="auto" selected>automático</option>
        <option value="1">1 columna</option>
        <option value="2">2 columnas</option>
        <option value="3">3 columnas</option>
      </select>
    </label>
    <p class="pi-mini" id="aviso-cols"></p>

    <h2>Código QR</h2>
    <label class="pi-op"><input type="checkbox" id="op-qr"> Ponerlo sobre el mapa</label>
    <input type="url" id="qr-dir" placeholder="https://tu-direccion.com"
           style="width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--papel-2);color:var(--tinta);font-size:.85rem">
    <p class="pi-mini" id="qr-aviso">Va abajo a la derecha del mapa, donde no hay nada.</p>

    <h2>Qué mostrar</h2>
    <div id="grupos"></div>

    <h2>Órganos</h2>
    <div class="pi-fila-btn">
      <button type="button" data-todos="1">Todos</button>
      <button type="button" data-todos="0">Ninguno</button>
    </div>
    <div class="pi-sub" id="organos"></div>
    <p class="pi-mini" id="resumen"></p>
  </aside>

  <div class="pi-lienzo">
    <div class="pi-escala" id="escala">
      <div class="hoja" id="hoja" data-orient="apaisado">
        <div class="hoja-izq">
          <div class="hoja-mapa">
            <img id="hoja-fondo" src="img/mapa.webp" alt="Mapa de la República de los Niños">
            <div id="hoja-marcas"></div>
            <div class="hoja-qr" id="hoja-qr" hidden>
              <div id="qr-svg"></div>
              <i>Mapa en vivo y cronograma</i>
              <b id="qr-url"></b>
            </div>
          </div>
          <p class="hoja-pie" id="pie"></p>
        </div>
        <div class="hoja-lado">
          <div class="hoja-titulo">
            <img src="img/logos/MINULP.webp" alt="">
            <div>
              <b>MINULP 2026</b>
              <span>República de los Niños, Gonnet<br>22 al 25 de septiembre de 2026</span>
            </div>
          </div>
          <p class="refs-tit">Referencias</p>
          <div class="refs" id="refs" data-cols="1"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { ORGANOS, CREDITOS } from './js/datos.js';
import { svgQR } from './js/qr.js';
import { TIPOS, GRUPOS, icono, todosLosPuntos } from './js/mapa.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const puntos = todosLosPuntos();
const estado = {
  grupos: new Set(['sede', 'sanitario']),      // arranca como el mapa impreso 2025
  organos: new Set(ORGANOS.map((o) => o.sigla)),
  rotulos: true,
  cols: 'auto',
};

// ------------------------------------------------------------------ panel
$('#grupos').innerHTML = GRUPOS.map((g) => `
  <label class="pi-op">
    <input type="checkbox" data-g="${g.id}" ${estado.grupos.has(g.id) ? 'checked' : ''}>
    <span class="pi-punto" style="background:${TIPOS[g.tipos[0]].color}">${icono(g.tipos[0])}</span>
    ${esc(g.etiqueta)}
  </label>`).join('');

$('#organos').innerHTML = ORGANOS.map((o) => `
  <label class="pi-op">
    <input type="checkbox" data-o="${esc(o.sigla)}" checked>
    <img src="img/logos/${o.sigla}.webp" alt="">
    ${esc(o.sigla)}
  </label>`).join('');

$('#grupos').addEventListener('change', (e) => {
  const g = e.target.dataset.g;
  if (!g) return;
  if (e.target.checked) estado.grupos.add(g); else estado.grupos.delete(g);
  pintar();
});
$('#organos').addEventListener('change', (e) => {
  const o = e.target.dataset.o;
  if (!o) return;
  if (e.target.checked) estado.organos.add(o); else estado.organos.delete(o);
  pintar();
});
document.querySelectorAll('[data-todos]').forEach((b) => b.addEventListener('click', () => {
  const on = b.dataset.todos === '1';
  estado.organos = new Set(on ? ORGANOS.map((o) => o.sigla) : []);
  document.querySelectorAll('#organos input').forEach((i) => { i.checked = on; });
  pintar();
}));
document.querySelectorAll('input[name=orient]').forEach((r) => r.addEventListener('change', () => {
  $('#hoja').dataset.orient = r.value;
  document.documentElement.dataset.orient = r.value;
  ajustarPagina(r.value);
  encajar();
  pintar();
}));
$('#op-oficial').addEventListener('change', (e) => {
  $('#hoja-fondo').src = e.target.checked ? 'img/oficial.webp' : 'img/mapa.webp';
});
$('#op-rotulos').addEventListener('change', (e) => { estado.rotulos = e.target.checked; pintar(); });
$('#op-cols').addEventListener('change', (e) => { estado.cols = e.target.value; pintar(); });
$('#btn-imprimir').addEventListener('click', () => window.print());

// ------------------------------------------------------------------- QR
const CLAVE_URL = 'minulp2026.urlPublica';
try {
  const guardada = localStorage.getItem(CLAVE_URL);
  if (guardada) $('#qr-dir').value = guardada;
} catch (e) { /* sin storage, se escribe cada vez */ }

function pintarQR() {
  const caja = $('#hoja-qr');
  const dir = $('#qr-dir').value.trim();
  const quiere = $('#op-qr').checked;
  if (!quiere) { caja.hidden = true; $('#qr-aviso').textContent = 'Va abajo a la derecha del mapa, donde no hay nada.'; return; }
  if (!dir) {
    caja.hidden = true;
    $('#qr-aviso').textContent = 'Escribí la dirección donde publicaste la app.';
    return;
  }
  try {
    $('#qr-svg').innerHTML = svgQR(dir, { borde: 2 });
    $('#qr-url').textContent = dir.replace(/^https?:\/\//, '').replace(/\/$/, '');
    caja.hidden = false;
    $('#qr-aviso').textContent = '';
    try { localStorage.setItem(CLAVE_URL, dir); } catch (e) { /* nada */ }
  } catch (e) {
    caja.hidden = true;
    $('#qr-aviso').textContent = 'Esa dirección es demasiado larga para el código.';
  }
}
$('#op-qr').addEventListener('change', pintarQR);
$('#qr-dir').addEventListener('input', pintarQR);

/** El tamaño de página se cambia con una regla @page inyectada. */
let reglaPagina = null;
function ajustarPagina(orient) {
  if (!reglaPagina) {
    reglaPagina = document.createElement('style');
    document.head.appendChild(reglaPagina);
  }
  reglaPagina.textContent = `@media print { @page { size: A4 ${
    orient === 'vertical' ? 'portrait' : 'landscape'}; margin: 0; } }`;
}
ajustarPagina('apaisado');

// ---------------------------------------------------------------- dibujo
function visibles() {
  const tipos = new Set();
  GRUPOS.forEach((g) => { if (estado.grupos.has(g.id)) g.tipos.forEach((t) => tipos.add(t)); });
  return puntos.filter((p) => {
    if (!tipos.has(p.tipo)) return false;
    if (p.organo) return estado.organos.has(p.organo.sigla);
    return true;
  });
}

/**
 * Corre los rótulos que se pisan. En el Centro Cívico hay ocho sedes muy
 * juntas: sin esto las siglas se superponen y no se lee ninguna.
 */
function acomodarRotulos(nodos) {
  const puestos = [];
  const choca = (c) => puestos.some((o) => !(c.der < o.izq || c.izq > o.der ||
                                             c.aba < o.arr || c.arr > o.aba));
  const base = $('#hoja-marcas').getBoundingClientRect();
  for (const { nodo, rot } of nodos) {
    if (!rot) continue;
    const opciones = [0, 12, -20, 24, -32, 36];
    for (const dy of opciones) {
      rot.style.marginTop = (dy / 3.78) + 'mm';           // px -> mm aprox
      const r = rot.getBoundingClientRect();
      const c = { izq: r.left - base.left, der: r.right - base.left,
                  arr: r.top - base.top, aba: r.bottom - base.top };
      if (!choca(c) || dy === opciones[opciones.length - 1]) { puestos.push(c); break; }
    }
  }
}

function pintar() {
  const lista = visibles();

  // marcas sobre el mapa: primero los servicios, los órganos arriba de todo
  const orden = [...lista].sort((a, b) => (a.organo ? 1 : 0) - (b.organo ? 1 : 0));
  $('#hoja-marcas').innerHTML = orden.map((p) => {
    const o = p.organo;
    const interior = o
      ? `<img src="img/logos/${o.sigla}.webp" alt="">`
      : icono(p.tipo);
    const color = o ? `var(--c-${o.sigla.toLowerCase()})` : TIPOS[p.tipo].color;
    const rot = (o && estado.rotulos)
      ? `<span class="hm-rot">${esc(o.sigla)}</span>` : '';
    return `<div class="hm ${o ? 'hm-org' : 'hm-serv'}"
                 style="left:${(p.x * 100).toFixed(2)}%; top:${(p.y * 100).toFixed(2)}%">
              <span class="hm-disco" style="background:${color}">${interior}</span>${rot}
            </div>`;
  }).join('');

  requestAnimationFrame(() => acomodarRotulos(
    [...$('#hoja-marcas').children].map((nodo) => ({ nodo, rot: nodo.querySelector('.hm-rot') }))));

  // referencias: solo lo que quedó visible
  const bloques = [];
  const orgs = lista.filter((p) => p.organo).map((p) => p.organo);
  if (orgs.length) {
    bloques.push(`<div class="refs-grupo"><p>Órganos</p>${
      orgs.map((o) => `<div class="ref">
        <img src="img/logos/${o.sigla}.webp" alt="">
        <span><b>${esc(o.sigla)}</b> · ${esc(o.sede)}</span></div>`).join('')}</div>`);
  }
  const porTipo = new Map();
  lista.filter((p) => !p.organo).forEach((p) => {
    porTipo.set(p.tipo, (porTipo.get(p.tipo) || 0) + 1);
  });
  if (porTipo.size) {
    bloques.push(`<div class="refs-grupo"><p>Servicios y lugares</p>${
      [...porTipo].map(([t, n]) => `<div class="ref">
        <span class="pi-punto" style="background:${TIPOS[t].color}">${icono(t)}</span>
        <span>${esc(TIPOS[t].etiqueta)}${n > 1 ? ` <b>(${n})</b>` : ''}</span></div>`).join('')}</div>`);
  }
  $('#refs').innerHTML = bloques.join('') ||
    '<p class="ref"><span>No hay nada seleccionado.</span></p>';

  acomodarColumnas();

  $('#pie').innerHTML =
    `<b>Diseñado y desarrollado por ${esc(CREDITOS.usuario)} para ${esc(CREDITOS.para)}.</b><br>` +
    'Ilustración del predio: República de los Niños, Municipalidad de La Plata. ' +
    'Calles del entorno: © colaboradores de OpenStreetMap.';

  $('#resumen').textContent =
    `${orgs.length} ${orgs.length === 1 ? 'órgano' : 'órganos'} y ` +
    `${lista.length - orgs.length} ${lista.length - orgs.length === 1 ? 'punto' : 'puntos'} más en la hoja.`;
}

/**
 * Reparte las referencias en columnas. En 'automatico' prueba con una y va
 * sumando solo si no entran a lo alto. El multicolumna del navegador nunca
 * superpone texto: parte el contenido, no lo encima.
 */
function acomodarColumnas() {
  const refs = $('#refs');
  const lado = $('.hoja-lado');
  if (estado.cols !== 'auto') {
    refs.dataset.cols = estado.cols;
    avisarColumnas(Number(estado.cols), false);
    return;
  }
  // Todo en pixeles de maquetado: getBoundingClientRect() vendria afectado por
  // el scale() del preview y scrollHeight no, y mezclarlos daba de mas columnas.
  const MM = 3.7795;
  const tope = $('#hoja').clientHeight - (lado.offsetTop + refs.offsetTop) - 6 * MM;
  let n = 1;
  refs.dataset.cols = n;
  while (n < 3 && refs.scrollHeight > tope) {
    n += 1;
    refs.dataset.cols = n;
  }
  avisarColumnas(n, true);
}

/** Si algo quedo afuera de la hoja hay que decirlo: en papel se cortaria. */
function avisarColumnas(n, automatico) {
  const hoja = $('#hoja');
  const seCorta = hoja.scrollHeight > hoja.clientHeight + 2;
  const el = $('#aviso-cols');
  if (seCorta) {
    el.style.color = 'var(--alerta)';
    el.textContent = n < 3
      ? `Con ${n} ${n === 1 ? 'columna' : 'columnas'} no entra todo en la hoja. Probá con más columnas o mostrá menos puntos.`
      : 'No entra todo en la hoja: sacá algún grupo o pasá a A4 apaisado.';
    return;
  }
  el.style.color = '';
  el.textContent = (automatico && n > 1)
    ? `Las referencias no entraban en una columna: van en ${n}.` : '';
}

// ------------------------------------------------- encajar la hoja en pantalla
function encajar() {
  // offsetWidth es el ancho de maquetado, sin la transformacion: usarlo evita
  // el calculo circular de medir algo que ya esta escalado
  const disponible = $('.pi-lienzo').clientWidth - 8;
  const natural = $('#hoja').offsetWidth;
  if (!natural || !disponible) return;
  const k = Math.min(1, disponible / natural);
  $('#escala').style.transform = `scale(${k})`;
  $('#escala').style.height = ($('#hoja').offsetHeight * k) + 'px';
}
