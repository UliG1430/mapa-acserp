[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/editor"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/editor.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/login.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/editor"
  to = "/admin/editor.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/mapa"
  status = 200
  force = true

[[redirects]]
  from = "/public/*"
  to = "/.netlify/functions/mapa"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/public/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=5, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
